# ===== Aplicacion =====
spring.application.name=airmap-backend
server.port=8080

# Lee las variables del archivo .env (que NO se sube a Git)
spring.config.import=optional:file:.env[.properties]

# ===== Base de datos =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Para ver el SQL en consola durante pruebas
#spring.jpa.show-sql=true

# ===== JWT =====
jwt.secret=${JWT_SECRET}
# 1 hora en milisegundos
jwt.expiration=3600000

# ===== Google (ingreso con Google) =====
google.client-id=${GOOGLE_CLIENT_ID:}


# ===== Administrador (un solo usuario, no se registra: se crea al iniciar el back) =====
admin.correo=${ADMIN_CORREO:}
admin.contrasena=${ADMIN_CONTRASENA:}

# ===== Correo (envio con JavaMail) =====
# Los datos de la cuenta que envia los correos van en el .env (MAIL_USER y MAIL_PASSWORD)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
app.nombre-remitente=AirMap
# Direccion del front: los enlaces de los correos apuntan aqui
app.front-url=${FRONT_URL:http://localhost:4200}

# ===== APIs externas =====

# OpenSky Network (posiciones de los vuelos)
external.opensky.url=https://opensky-network.org/api

# adsbdb (aerolinea, origen y destino de cada vuelo)
external.adsbdb.url=https://api.adsbdb.com/v0

# openrouteservice (ruta terrestre hasta el aeropuerto)
external.ors.url=https://api.openrouteservice.org
external.ors.apikey=${ORS_API_KEY:}

# Gemini (asistente de IA).
external.gemini.url=https://generativelanguage.googleapis.com/v1beta
external.gemini.modelo=${GEMINI_MODELO:gemini-3.5-flash-lite}
external.gemini.apikey=${GEMINI_API_KEY:}
