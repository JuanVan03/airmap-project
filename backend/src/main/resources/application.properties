# ===== Aplicacion =====
spring.application.name=airmap-backend
server.port=8080

# Lee las variables del archivo .env (que NO se sube a Git)
spring.config.import=optional:file:.env[.properties]

# ===== Base de datos =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Para ver el SQL en consola durante pruebas
#spring.jpa.show-sql=true

# ===== JWT =====
jwt.secret=${JWT_SECRET}
# 1 hora en milisegundos
jwt.expiration=3600000

# ===== Google (ingreso con Google) =====
google.client-id=${GOOGLE_CLIENT_ID:}


# ===== APIs externas =====

# OpenSky Network (posiciones de los vuelos)
external.opensky.url=https://opensky-network.org/api

# adsbdb (aerolinea, origen y destino de cada vuelo)
external.adsbdb.url=https://api.adsbdb.com/v0

# openrouteservice (ruta terrestre hasta el aeropuerto)
external.ors.url=https://api.openrouteservice.org
external.ors.apikey=${ORS_API_KEY:}
