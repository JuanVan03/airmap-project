<nav class="navbar">
  <a class="logo" routerLink="/inicio">
    <app-logocomponent class="logo-imagen"></app-logocomponent>
  </a>

  <ul class="enlaces">
    <li><a routerLink="/inicio" routerLinkActive="activo">Inicio</a></li>
    <li><a routerLink="/vuelos" routerLinkActive="activo">Vuelos</a></li>
    <li><a routerLink="/viajes-terrestres" routerLinkActive="activo">Viajes terrestres</a></li>
    <li><a routerLink="/asistente" routerLinkActive="activo">Asistente IA</a></li>
    <li><a routerLink="/informacion" routerLinkActive="activo">Información</a></li>
  </ul>

  <div class="acciones">
    @if (autenticado()) {
      @if (esAdmin()) {
        <a class="btn btn-secundario" routerLink="/admin">Administración</a>
      } @else {
        <a class="btn btn-secundario" routerLink="/perfil">{{ primerNombre() }}</a>
      }
      <button type="button" class="btn btn-primario" (click)="cerrarSesion()">Cerrar sesión</button>
    } @else {
      <a class="btn btn-secundario" routerLink="/login">Ingresar</a>
      <a class="btn btn-primario" routerLink="/register">Registrarse</a>
    }
  </div>
</nav>
